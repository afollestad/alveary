name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      SNAPSHOT_ARTIFACTS: .build/snapshot-failures
      # Fails the Build step on a body drifting toward the compiler's per-expression type-check
      # budget, which otherwise only errors on this slower hardware and never locally. Set for
      # the whole job so the build, test, and snapshot steps compile with identical settings and
      # keep sharing one set of products.
      #
      # Calibrate against *these* runners, not a dev machine. The same symbols measured 7x or
      # more higher here than locally (slower hardware, and a pinned toolchain rather than
      # whatever Xcode a dev has), so a local reading badly understates the real cost. The
      # slowest symbols measured here are `#Predicate` fetch shapes at ~1.5s, so 3000 keeps
      # roughly 2x headroom for the app target while still tripping well before a hard
      # `unable to type-check this expression` error.
      #
      # Test sources fail at a higher bar because their floor is attribution noise, not real
      # solve cost: the solver's wall-clock timer bills first-touch framework deserialization to
      # whichever expression in a frontend batch needs it first, and `AppDelegateTests`
      # statements whose genuine solve is under 100ms locally have measured 3063-7156ms here
      # across runs, invariant to how the statement was written. That noise drifts upward across
      # toolchains, so `typecheck-budget.sh` exempts the paths it lands on from the failure scan
      # rather than absorbing it into these numbers; chasing it by raising them instead took the
      # whole test target past the point where a genuine offender would still be caught.
      # 7000 stays as headroom for the rest of the test target, whose readings run well under it.
      # App sources have one such exemption too — AppKit's `NSMenu` metadata, measured at 3264ms
      # against this 3000 — so do not read that number as slack the app target can spend.
      # The compiler flag stays at the base budget for every step (identical build settings,
      # shared products); only `test.sh`'s failure scan reads the higher value.
      TYPECHECK_BUDGET_MS: "3000"
      TYPECHECK_TEST_BUDGET_MS: "7000"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.swiftpm/cache
            ~/Library/Caches/org.swift.swiftpm
            .build/xcode/SourcePackages
          key: ${{ runner.os }}-xcode-26.5-swiftpm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.5-swiftpm-
            ${{ runner.os }}-swiftpm-

      - name: Setup
        run: ./scripts/setup.sh

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts/ci -p '*_tests.py'

      - name: Lint
        run: ./scripts/lint.sh

      - name: Build
        run: ./scripts/build.sh --no-xcsift

      - name: Test
        run: ./scripts/test.sh

      - name: Verify snapshots
        run: ./scripts/snapshots.sh verify

      - name: Check generated Needle output
        run: git diff --exit-code -- Alveary/DI/Generated/NeedleGenerated.swift

      - name: Check whitespace
        run: git diff --check

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-logs
          path: |
            .build/xcode/Logs/Test
            .build/snapshot-failures
            **/*.xcresult
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
