name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SNAPSHOT_ARTIFACTS: .build/snapshot-failures
      # Keep the compiler flags identical across build and test so they share products;
      # only test.sh's failure scan uses the higher test threshold.
      # These budgets were calibrated on macos-26 with Xcode 26.5: #Predicate fetch shapes
      # reached ~1.5s, while first-touch framework deserialization was attributed to trivial
      # test statements at 3063-7156ms and an AppKit menu source at 3264ms.
      # Preserve the budgets for the Xcode 27 migration and assess clean hosted runs, not
      # faster local timings. scripts/lib/typecheck-budget.sh documents the existing noise
      # exemptions; investigate new offenders rather than raising thresholds to hide them.
      TYPECHECK_BUDGET_MS: "3000"
      TYPECHECK_TEST_BUDGET_MS: "7000"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Hosted test subprocesses can fall back to the system selection instead of DEVELOPER_DIR.
      - name: Select Xcode
        run: sudo xcode-select --switch "$DEVELOPER_DIR"

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun swift --version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.swiftpm/cache
            ~/Library/Caches/org.swift.swiftpm
            .build/xcode/SourcePackages
          key: ${{ runner.os }}-xcode-27.0-swiftpm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-27.0-swiftpm-
            ${{ runner.os }}-swiftpm-

      - name: Setup
        run: ./scripts/setup.sh

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts/ci -p '*_tests.py'

      - name: Lint
        run: ./scripts/lint.sh

      - name: Build
        run: ./scripts/build.sh --no-xcsift

      - name: Test
        run: ./scripts/test.sh

      - name: Check generated Needle output
        run: git diff --exit-code -- Alveary/DI/Generated/NeedleGenerated.swift

      - name: Check whitespace
        run: git diff --check

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-logs
          path: |
            .build/xcode/Logs/Test
            .build/snapshot-failures
            **/*.xcresult
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
