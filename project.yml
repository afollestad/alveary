name: Alveary
options:
  bundleIdPrefix: com.afollestad
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.3"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  Alveary:
    build:
      targets:
        Alveary: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AlvearyTests
      environmentVariables:
        ALVEARY_HOSTED_UNIT_TEST: "1"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
fileGroups:
  - docs
targets:
  Alveary:
    type: application
    platform: macOS
    sources:
      - path: Alveary
        excludes:
          - "**/.DS_Store"
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
      - path: AppIcon.icon
    dependencies:
      - package: needle
        product: NeedleFoundation
      - package: BlockInputKit
        product: BlockInputKit
      - package: FluidAudio
        product: FluidAudio
      - package: AgentCLIKit
        product: AgentCLIKit
      - package: SwiftTerm
        product: SwiftTerm
      - sdk: Carbon.framework
      - sdk: AVFoundation.framework
      - sdk: IOKit.framework
      - sdk: ScreenCaptureKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afollestad.alveary
        MARKETING_VERSION: 0.2.7
        CURRENT_PROJECT_VERSION: 16
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/CodeSigning/Alveary.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          OTHER_CODE_SIGN_FLAGS: "--requirements $(SRCROOT)/Config/CodeSigning/AlvearyDebugTCC.requirements"
        Release:
          # Belt-and-braces: demo mode is already `#if DEBUG` in every file, and `DemoAssets/`
          # sits outside every `sources:` path so xcodegen cannot bundle it. This also drops the
          # demo sources from the Release compile if an `#if DEBUG` is ever forgotten.
          EXCLUDED_SOURCE_FILE_NAMES: "$(SRCROOT)/Alveary/Demo/*"
    preBuildScripts:
      - name: Needle Code Generation
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          NEEDLE_CLI=""
          if command -v needle &> /dev/null; then
            NEEDLE_CLI="needle"
          fi
          if [ -z "$NEEDLE_CLI" ]; then
            echo "error: needle is required for code generation. Install via 'brew install needle'."
            exit 1
          fi

          NEEDLE_VERSION="$("$NEEDLE_CLI" version 2>/dev/null || true)"
          if [ "$NEEDLE_VERSION" != "0.25.1" ]; then
            echo "error: needle 0.25.1 is required to match the pinned NeedleFoundation package. Found: ${NEEDLE_VERSION:-unknown}."
            exit 1
          fi

          mkdir -p "${SRCROOT}/Alveary/DI/Generated"
          export SOURCEKIT_LOGGING=0

          # Generate to a staging file and copy it over only when the content actually differs.
          # This phase is not dependency-analysed, so it runs on every build; writing
          # unconditionally moved the destination's mtime every time, which made llbuild
          # recompile it and re-link on builds where nothing had changed.
          GENERATED="${SRCROOT}/Alveary/DI/Generated/NeedleGenerated.swift"
          # A directory, not `mktemp <template>.swift`: BSD mktemp only substitutes trailing
          # `X`s, so that form yields a fixed path two concurrent builds would race on.
          STAGE_DIR=$(mktemp -d)
          if [ -z "$STAGE_DIR" ] || [ ! -d "$STAGE_DIR" ]; then
            echo "error: could not create a staging directory for Needle output." >&2
            exit 1
          fi
          STAGED="$STAGE_DIR/NeedleGenerated.swift"
          trap 'rm -rf "$STAGE_DIR"' EXIT

          "$NEEDLE_CLI" generate \
            "$STAGED" \
            "${SRCROOT}/Alveary/DI" \
            --exclude-paths "/DI/Generated"
          STAGED="$STAGED" python3 -c 'import os; from pathlib import Path; path = Path(os.environ["STAGED"]); text = path.read_text(); path.write_text(text if text.endswith("\n") else text + "\n")'

          # This phase has no `set -e`, so a Needle failure would otherwise reach the copy
          # below, where `>` truncates the destination before `cat` reports the missing input.
          if [ ! -s "$STAGED" ]; then
            echo "error: Needle produced no output at $STAGED." >&2
            exit 1
          fi

          # `cat >` rather than `mv` so the destination keeps its own permissions.
          if ! cmp -s "$STAGED" "$GENERATED"; then
            cat "$STAGED" > "$GENERATED"
          fi
    postBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          # Not dependency-analysed, so this reruns on every xcodebuild invocation. CI lints the
          # same files in its own step, making those reruns pure cost; local builds keep it so a
          # lint error surfaces without waiting for CI.
          if [ "${CI:-}" != "true" ] && command -v swiftlint &> /dev/null; then
            swiftlint
          fi
      - name: Copy Demo Assets (Debug only)
        basedOnDependencyAnalysis: false
        script: |
          # `DemoAssets/` deliberately lives outside every `sources:` path so xcodegen cannot add
          # it to Copy Bundle Resources; `#if DEBUG` cannot strip a bundled resource. This phase
          # is the only route into the app, and `scripts/ci/verify-exported-app.sh` fails the
          # release if one ever reaches an exported build anyway.
          if [ "$CONFIGURATION" = "Debug" ]; then
            demo_assets="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/DemoAssets"
            rm -rf "$demo_assets"
            mkdir -p "$demo_assets"
            cp "$SRCROOT"/DemoAssets/*.png "$demo_assets/"
          fi
  AlvearyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AlvearyTests
        excludes:
          - "**/.DS_Store"
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
    dependencies:
      - target: Alveary
      - package: BlockInputKit
        product: BlockInputKit
      - package: AgentCLIKit
        product: AgentCLIKit
      - package: swift-snapshot-testing
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afollestad.alveary.tests
        GENERATE_INFOPLIST_FILE: YES
packages:
  AgentCLIKit:
    url: https://github.com/afollestad/AgentCLIKit.git
    revision: "6334a715ab5f3c4388ee5f94ecdd5f0736d68c66"
  BlockInputKit:
    url: https://github.com/afollestad/BlockInputKit.git
    revision: "0a0aa9f5992ec06911beae40dfb80660cfca351a"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.15.5"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    revision: "d5ee56e1c74777120f3af688600d336de4201bd2"
  needle:
    url: https://github.com/uber/needle.git
    revision: "69f7a889d2736f2621c6083ac29e0a75d158f249"
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: "1.19.2"
  # No target names this one. It reaches the graph through `swift-snapshot-testing` ->
  # `swift-custom-dump`, which asks for it `from: "1.2.2"`, and 1.12.0 turned it into a shim over
  # `pointfreeco/swift-issue-reporting`. Both then vend a library product named `IssueReporting`,
  # and Xcode keys package products by name, so it refuses the graph before compiling anything:
  # "PIFLoader: GUID '...IssueReporting...' has already been registered". Only a from-scratch
  # resolve reaches the shim, so dropping this pin stays green against a warm SwiftPM cache and
  # reds the next cold one. Remove it once `swift-custom-dump` requires `swift-issue-reporting`
  # directly and the shim leaves the graph.
  xctest-dynamic-overlay:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay
    exactVersion: "1.11.0"
